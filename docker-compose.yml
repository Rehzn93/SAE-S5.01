services:
  db:
    image: postgres:16-alpine
    container_name: sae_cars_db
    restart: always
    environment:
      POSTGRES_USER: user_sae
      POSTGRES_PASSWORD: password_sae
      POSTGRES_DB: vehicules_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: